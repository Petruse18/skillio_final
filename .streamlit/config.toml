[theme]
base = "light"
primaryColor = "#121513"
backgroundColor = "#F4F4F1"
secondaryBackgroundColor = "#EEEEEA"
textColor = "#121513"
font = "sans serif"
baseRadius = "10px"

[server]
headless = true
maxUploadSize = 15
runOnSave = true

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
