[theme]
base = "dark"
primaryColor = "#3FBF83"
backgroundColor = "#0F1714"
secondaryBackgroundColor = "#1D2A24"
textColor = "#E6EFE9"
font = "sans serif"
baseRadius = "14px"

[server]
headless = true
maxUploadSize = 15
runOnSave = true

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
